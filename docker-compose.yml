services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-synctask}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-synctask_pass}
      POSTGRES_DB: ${DB_NAME:-synctask_dev}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-synctask} -d ${DB_NAME:-synctask_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GIN_MODE=debug
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-synctask}
      - DB_PASSWORD=${DB_PASSWORD:-synctask_pass}
      - DB_NAME=${DB_NAME:-synctask_dev}
      - DB_SSLMODE=disable
      - FRONTEND_URL=http://localhost:3000

volumes:
  db_data:
